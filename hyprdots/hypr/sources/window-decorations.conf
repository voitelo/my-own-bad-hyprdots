# window decorations - dude from dotfiles

decoration {
  rounding = 13
  rounding_power = 4

  # Window opacity
  active_opacity = 1.0
  inactive_opacity = 0.95

  # Shadow settings
  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  } 

  # Blur settings
  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  } 
} 
